<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Resolvo Architecture</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/arch.css?v=1">
</head>
<body>
<header class="ah">
  <button class="ah-menu" id="menuBtn" aria-label="Open the section list" aria-expanded="false" aria-controls="nav">Sections</button>
  <div class="ah-brand"><span class="ah-mark" aria-hidden="true"></span><span class="ah-name">Resolvo architecture</span><span class="ah-tag">Owner only</span></div>
  <div class="ah-live" id="liveBar" aria-live="polite">Loading…</div>
  <div class="ah-actions">
    <button class="btn" id="refreshBtn" type="button">Refresh</button>
    <button class="btn" id="themeBtn" type="button" aria-label="Switch between light and dark">Theme</button>
    <a class="btn" href="/owner-console">Owner Console</a>
  </div>
</header>

<div class="shell">
  <nav class="side" id="nav" aria-label="Sections">
    <label class="srch" for="q"><span class="sr">Search this page</span>
      <input id="q" type="search" placeholder="Search this page" autocomplete="off">
    </label>
    <div id="navList"></div>
    <div class="side-foot" id="sideFoot"></div>
  </nav>
  <main class="main" id="main" tabindex="-1">
    <div id="state" class="state">Loading the architecture…</div>
    <div id="content" hidden></div>
    <p class="nomatch" id="noMatch" hidden>Nothing on this page matches that search.</p>
  </main>
</div>

<div class="overlay" id="loginOverlay" hidden>
  <form class="dialog" id="loginForm">
    <h1>Owner sign-in</h1>
    <p>This page is for the owner account only. It shows how Resolvo is built and live facts from the running server.</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" autocapitalize="none" value="contact@resolvogroup.com">
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" autocomplete="current-password">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn main wide" type="submit">Sign in</button>
  </form>
</div>
<script src="/js/arch.js?v=1"></script>
</body>
</html>
