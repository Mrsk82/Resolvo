<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found — Resolvo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0B0F19;color:#f1f5f9;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.wrap{text-align:center;max-width:480px;}
.code{font-size:120px;font-weight:800;line-height:1;color:#111827;letter-spacing:-4px;position:relative;display:inline-block;margin-bottom:8px;}
.code::after{content:'404';position:absolute;inset:0;background:linear-gradient(135deg,#10B981,#6366F1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.icon{width:64px;height:64px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
h1{font-size:24px;font-weight:700;color:#f1f5f9;margin-bottom:10px;letter-spacing:-.3px;}
p{font-size:15px;color:#64748b;line-height:1.7;margin-bottom:32px;}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn{padding:11px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;transition:opacity .15s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:none;}
.btn-secondary{background:transparent;color:#94a3b8;border:1px solid rgba(255,255,255,.12);}
.btn:hover{opacity:.85;}
.hint{margin-top:40px;font-size:12px;color:#374151;}
.hint a{color:#10B981;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </div>
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p>The link you followed might be broken, the page may have moved, or you may not have access to it.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Go to dashboard
    </a>
    <a href="javascript:history.back()" class="btn btn-secondary">← Go back</a>
  </div>
  <div class="hint">Need help? <a href="mailto:contact@resolvogroup.com">contact@resolvogroup.com</a></div>
</div>
</body>
</html>
