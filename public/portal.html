<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-27BVPWPG8N"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-27BVPWPG8N");</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--accent:#10B981;--accent-dim:rgba(16,185,129,.1);--accent-border:rgba(16,185,129,.25);}
body{background:#f0f4f8;font-family:'Inter',sans-serif;min-height:100vh;}

/* TOPBAR */
.topbar{background:#0B0F19;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-brand{display:flex;align-items:center;gap:12px;}
.brand-logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0;}
.brand-name{font-size:15px;font-weight:800;color:#fff;}
.brand-tagline{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
#userChip{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:20px;padding:5px 12px 5px 8px;}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
#userEmailDisplay{font-size:12px;color:rgba(255,255,255,.7);}
#logoutBtn{display:none;background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;}
#logoutBtn:hover{border-color:rgba(255,255,255,.3);color:#fff;}

/* MAIN LAYOUT */
.page{max-width:680px;margin:0 auto;padding:32px 20px 60px;}

/* LOGIN CARD */
.card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden;}
.card-body{padding:28px 32px;}
.card-header{padding:20px 32px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:12px;}
.card-icon{width:36px;height:36px;border-radius:9px;background:var(--accent-dim);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;font-size:18px;}

.login-title{font-size:20px;font-weight:800;color:#111827;margin-bottom:5px;}
.login-sub{font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:24px;}

label{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:14px;outline:none;font-family:inherit;color:#111827;background:#f9fafb;transition:border-color .15s,box-shadow .15s,background .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);background:#fff;}
.fg{margin-bottom:16px;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:inherit;width:100%;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;}
.btn-ghost{background:#f9fafb;color:#374151;border:1px solid #e5e7eb;margin-top:8px;}
.btn-ghost:hover{background:#f3f4f6;}

/* OTP NOTICE */
.otp-notice{background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:9px;padding:12px 14px;font-size:13px;color:#065f46;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* ERROR */
#loginError{display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;color:#dc2626;margin-top:12px;}

/* PORTAL */
#portalSection{display:none;}
.portal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.portal-toolbar h2{font-size:18px;font-weight:800;color:#111827;}
.new-ticket-btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.new-ticket-btn:hover{opacity:.9;}

/* TICKET FORM */
.ticket-form-card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:24px;margin-bottom:16px;display:none;}
.ticket-form-title{font-size:15px;font-weight:800;color:#111827;margin-bottom:18px;}
.form-actions{display:flex;gap:10px;margin-top:4px;}
.form-actions .btn{flex:1;}
#nt_success{display:none;text-align:center;padding:20px;background:#f0fdf4;border-radius:10px;color:#166534;font-size:14px;font-weight:600;}

/* TICKET LIST */
.tickets-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden;}
.tickets-header{padding:16px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;}
.tickets-header h3{font-size:14px;font-weight:700;color:#111827;}
.tickets-count{font-size:12px;color:#9ca3af;}
.ticket-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #f9fafb;transition:background .1s;cursor:default;}
.ticket-row:last-child{border-bottom:none;}
.ticket-row:hover{background:#fafafa;}
.ticket-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-new{background:#7c3aed;}
.dot-open{background:#2563eb;}
.dot-pending{background:#d97706;}
.dot-resolved{background:#16a34a;}
.dot-closed{background:#9ca3af;}
.ticket-info{flex:1;min-width:0;}
.ticket-subject{font-size:14px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.ticket-meta{font-size:11px;color:#9ca3af;}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;text-transform:capitalize;}
.badge-new{background:#ede9fe;color:#6d28d9;}
.badge-open{background:#dbeafe;color:#1d4ed8;}
.badge-resolved{background:#dcfce7;color:#166534;}
.badge-closed{background:#f3f4f6;color:#6b7280;}
.badge-pending{background:#fef3c7;color:#92400e;}

.empty-state{padding:48px 20px;text-align:center;}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-title{font-size:15px;font-weight:700;color:#374151;margin-bottom:6px;}
.empty-sub{font-size:13px;color:#9ca3af;}

#loginSection{display:none;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="brand-logo" id="brandLogoEl">S</div>
    <div>
      <div class="brand-name" id="brandNameEl">Customer Portal</div>
      <div class="brand-tagline">Support &amp; requests</div>
    </div>
  </div>
  <div class="topbar-right">
    <div id="userChip">
      <div class="user-avatar" id="userAvatarEl">?</div>
      <span id="userEmailDisplay"></span>
    </div>
    <button id="logoutBtn" onclick="logout()">Sign out</button>
  </div>
</div>

<div class="page">

  <!-- LOGIN SECTION -->
  <div id="loginSection">
    <div class="card">
      <div class="card-header">
        <div class="card-icon">🔐</div>
        <div>
          <div style="font-size:14px;font-weight:700;color:#111827;">Sign in to your portal</div>
          <div style="font-size:12px;color:#6b7280;">We'll send a one-time code to your email</div>
        </div>
      </div>
      <div class="card-body">
        <div id="emailStep">
          <p class="login-sub">Enter the email address you use when contacting support.</p>
          <div class="fg"><label>Email Address</label><input id="emailInput" type="email" placeholder="your@email.com" autocomplete="email"></div>
          <button class="btn btn-primary" onclick="sendOTP()">Send login code →</button>
        </div>
        <div id="otpStep" style="display:none;">
          <div class="otp-notice">📧 Code sent to <strong id="sentToEmail" style="margin-left:4px;"></strong></div>
          <div class="fg"><label>6-digit code</label><input id="otpInput" type="number" placeholder="123456" maxlength="6" style="letter-spacing:.15em;font-size:20px;font-weight:700;text-align:center;"></div>
          <button class="btn btn-primary" id="verifyBtn" onclick="verifyOTP()">Verify & sign in →</button>
          <button class="btn btn-ghost" onclick="backToEmail()">← Try a different email</button>
        </div>
        <div id="loginError"></div>
      </div>
    </div>
  </div>

  <!-- PORTAL CONTENT -->
  <div id="portalSection">
    <div class="portal-toolbar">
      <h2>Your Requests</h2>
      <button class="new-ticket-btn" onclick="toggleNewTicket()">+ New Request</button>
    </div>

    <!-- NEW TICKET FORM -->
    <div class="ticket-form-card" id="newTicketForm">
      <div class="ticket-form-title">Submit a new support request</div>
      <div class="fg"><label>Subject *</label><input id="nt_subject" placeholder="Brief description of your issue"></div>
      <div class="fg"><label>Message *</label><textarea id="nt_body" rows="4" style="resize:vertical;" placeholder="Describe your issue in detail…"></textarea></div>
      <div class="fg"><label>Priority</label>
        <select id="nt_priority">
          <option value="Low">Low — General question</option>
          <option value="Medium" selected>Medium — Something not working</option>
          <option value="High">High — Blocking my work</option>
          <option value="Critical">Critical — System down</option>
        </select>
      </div>
      <div id="nt_success">✅ Request submitted! We'll get back to you soon.</div>
      <div class="form-actions" id="nt_actions">
        <button class="btn btn-ghost" onclick="toggleNewTicket()">Cancel</button>
        <button class="btn btn-primary" onclick="submitTicket()" style="flex:2;">Submit request →</button>
      </div>
    </div>

    <!-- TICKET LIST -->
    <div class="tickets-card">
      <div class="tickets-header">
        <h3>All requests</h3>
        <span class="tickets-count" id="ticketsCount"></span>
      </div>
      <div id="ticketList">
        <div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-title">Loading…</div></div>
      </div>
    </div>
  </div>

</div>

<script>
var SLUG=window.location.pathname.split('/')[2]||'';
var portalToken=localStorage.getItem('portal_token_'+SLUG);
var userEmail=localStorage.getItem('portal_email_'+SLUG);

// Load brand info
fetch('/portal/'+SLUG+'/auth').then(function(r){return r.json();}).then(function(d){
  if(d.brand){
    var accent=d.brand.accentColor||'#10B981';
    document.documentElement.style.setProperty('--accent',accent);
    var name=d.brand.name||'Support';
    document.getElementById('brandNameEl').textContent=name+' Portal';
    document.getElementById('brandLogoEl').textContent=name.charAt(0).toUpperCase();
    document.getElementById('brandLogoEl').style.background=accent;
    document.title=name+' Customer Portal';
  }
});

if(portalToken&&userEmail){showPortal();}
else{document.getElementById('loginSection').style.display='block';}

function sendOTP(){
  var email=document.getElementById('emailInput').value.trim();
  if(!email||!email.includes('@')){showError('Please enter a valid email address');return;}
  var btn=event.target;btn.textContent='Sending…';btn.disabled=true;
  fetch('/portal/'+SLUG+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})})
  .then(function(r){return r.json();}).then(function(d){
    if(d.otpSent){
      document.getElementById('sentToEmail').textContent=email;
      document.getElementById('emailStep').style.display='none';
      document.getElementById('otpStep').style.display='block';
      document.getElementById('otpInput').focus();
    }else{showError(d.error||'Failed to send code. Please try again.');btn.textContent='Send login code →';btn.disabled=false;}
  }).catch(function(){showError('Network error. Please try again.');btn.textContent='Send login code →';btn.disabled=false;});
}

function verifyOTP(){
  var email=document.getElementById('emailInput').value.trim();
  var otp=document.getElementById('otpInput').value.trim();
  var btn=document.getElementById('verifyBtn');btn.textContent='Verifying…';btn.disabled=true;
  fetch('/portal/'+SLUG+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,otp:otp})})
  .then(function(r){return r.json();}).then(function(d){
    if(d.success){
      localStorage.setItem('portal_token_'+SLUG,d.token);
      localStorage.setItem('portal_email_'+SLUG,d.email);
      portalToken=d.token;userEmail=d.email;
      showPortal();
    }else{showError(d.error||'Invalid code. Please try again.');btn.textContent='Verify & sign in →';btn.disabled=false;}
  }).catch(function(){showError('Network error. Please try again.');btn.textContent='Verify & sign in →';btn.disabled=false;});
}

function backToEmail(){
  document.getElementById('otpStep').style.display='none';
  document.getElementById('emailStep').style.display='block';
  document.getElementById('loginError').style.display='none';
}

function showPortal(){
  document.getElementById('loginSection').style.display='none';
  document.getElementById('portalSection').style.display='block';
  var chip=document.getElementById('userChip');chip.style.display='flex';
  document.getElementById('userEmailDisplay').textContent=userEmail||'';
  var av=document.getElementById('userAvatarEl');av.textContent=(userEmail||'?').charAt(0).toUpperCase();
  document.getElementById('logoutBtn').style.display='block';
  loadTickets();
}

function loadTickets(){
  fetch('/portal/'+SLUG+'/tickets',{headers:{'x-portal-token':portalToken}})
  .then(function(r){return r.json();}).then(function(d){
    var el=document.getElementById('ticketList');
    if(!d.success){
      el.innerHTML='<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-title">Session expired</div><div class="empty-sub"><a href="javascript:logout()" style="color:var(--accent);font-weight:600;">Sign in again →</a></div></div>';
      return;
    }
    var tickets=d.tickets||[];
    document.getElementById('ticketsCount').textContent=tickets.length+' request'+(tickets.length===1?'':'s');
    if(!tickets.length){
      el.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">No requests yet</div><div class="empty-sub">Submit your first support request using the button above.</div></div>';
      return;
    }
    var dotMap={new:'dot-new',open:'dot-open',pending:'dot-pending',resolved:'dot-resolved',closed:'dot-closed'};
    var badgeMap={new:'badge-new',open:'badge-open',pending:'badge-pending',resolved:'badge-resolved',closed:'badge-closed'};
    el.innerHTML=tickets.map(function(t){
      var s=t.status||'open';
      return '<div class="ticket-row">'+
        '<div class="ticket-dot '+(dotMap[s]||'dot-open')+'"></div>'+
        '<div class="ticket-info">'+
          '<div class="ticket-subject">'+escHtml(t.subject)+'</div>'+
          '<div class="ticket-meta">#'+escHtml(t.id)+' &nbsp;·&nbsp; '+escHtml((t.createdDate||'').split('T')[0])+'</div>'+
        '</div>'+
        '<span class="badge '+(badgeMap[s]||'badge-open')+'">'+escHtml(s)+'</span>'+
      '</div>';
    }).join('');
  });
}

function toggleNewTicket(){
  var f=document.getElementById('newTicketForm');
  f.style.display=f.style.display==='none'||!f.style.display?'block':'none';
  if(f.style.display==='block')document.getElementById('nt_subject').focus();
}

function submitTicket(){
  var subject=document.getElementById('nt_subject').value.trim();
  var body=document.getElementById('nt_body').value.trim();
  var priority=document.getElementById('nt_priority').value;
  if(!subject||!body){alert('Please fill in all required fields.');return;}
  var btn=event.target;btn.textContent='Submitting…';btn.disabled=true;
  fetch('/api/widget/'+SLUG+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:subject+'\n\n'+body,email:userEmail,subject:subject,priority:priority})})
  .then(function(r){return r.json();}).then(function(d){
    if(d.success){
      document.getElementById('nt_actions').style.display='none';
      document.getElementById('nt_success').style.display='block';
      document.getElementById('nt_subject').value='';document.getElementById('nt_body').value='';
      setTimeout(function(){
        document.getElementById('nt_success').style.display='none';
        document.getElementById('nt_actions').style.display='flex';
        document.getElementById('newTicketForm').style.display='none';
        btn.textContent='Submit request →';btn.disabled=false;
        loadTickets();
      },2200);
    }else{btn.textContent='Submit request →';btn.disabled=false;}
  }).catch(function(){btn.textContent='Submit request →';btn.disabled=false;});
}

function logout(){
  localStorage.removeItem('portal_token_'+SLUG);
  localStorage.removeItem('portal_email_'+SLUG);
  location.reload();
}

function showError(msg){
  var el=document.getElementById('loginError');el.textContent=msg;el.style.display='block';
  setTimeout(function(){el.style.display='none';},5000);
}

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
