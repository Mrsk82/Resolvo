<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server Error — Resolvo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0B0F19;color:#f1f5f9;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.wrap{text-align:center;max-width:480px;}
.code{font-size:120px;font-weight:800;line-height:1;color:#111827;letter-spacing:-4px;position:relative;display:inline-block;margin-bottom:8px;}
.code::after{content:'500';position:absolute;inset:0;background:linear-gradient(135deg,#EF4444,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.icon{width:64px;height:64px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
h1{font-size:24px;font-weight:700;color:#f1f5f9;margin-bottom:10px;letter-spacing:-.3px;}
p{font-size:15px;color:#64748b;line-height:1.7;margin-bottom:32px;}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn{padding:11px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;transition:opacity .15s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:none;}
.btn-secondary{background:transparent;color:#94a3b8;border:1px solid rgba(255,255,255,.12);}
.btn:hover{opacity:.85;}
.status-strip{display:flex;align-items:center;gap:8px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);border-radius:10px;padding:10px 16px;margin-bottom:28px;font-size:13px;color:#FCA5A5;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#EF4444;flex-shrink:0;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hint{margin-top:40px;font-size:12px;color:#374151;}
.hint a{color:#10B981;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </div>
  <div class="code">500</div>
  <h1>Something went wrong on our end</h1>
  <div class="status-strip"><div class="status-dot"></div>Our team has been notified and is looking into this.</div>
  <p>This is a server error — nothing you did caused it. Try refreshing the page or come back in a few minutes.</p>
  <div class="actions">
    <a href="javascript:location.reload()" class="btn btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Retry
    </a>
    <a href="/" class="btn btn-secondary">← Dashboard</a>
  </div>
  <div class="hint">Still broken? <a href="mailto:contact@resolvogroup.com">contact@resolvogroup.com</a></div>
</div>
</body>
</html>
